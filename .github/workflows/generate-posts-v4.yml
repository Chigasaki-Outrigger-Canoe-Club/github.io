name: Generate Posts

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "変わっていない記事も全部作り直す（記事のデザインを変えたとき）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-posts-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Ensure latest main
        run: |
          git fetch origin main
          git checkout main
          git fetch --all --prune
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Run generate_posts.js
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: node scripts/generate_posts.js

      - name: Update index.html
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node scripts/update_index.js

      - name: Update schedule (data/schedule.js)
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node scripts/update_schedule.js

      - name: Update page text from the content sheet
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node scripts/update_content.js

      - name: Commit generated posts and index.html
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A posts data/schedule.js
          git add *.html en/*.html
          git commit -m "Update posts, pages and schedule from the spreadsheet" || echo "No changes"

      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git push origin main