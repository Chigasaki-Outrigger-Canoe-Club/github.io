<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>茅ヶ崎アウトリガーカヌークラブ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =========================
   ベース設定
   ========================= */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: "Noto Sans JP", sans-serif;
  background: #05070a;
  color: #f5f5f5;
}

a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }

/* =========================
   ヘッダー
   ========================= */
.site-header {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  background: rgba(10,14,20,0.95);
  border-bottom: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.header-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-main {
  font-size: 15px;
  letter-spacing: 0.22em;
  font-weight: 700;
  text-transform: uppercase;
}

.logo-sub {
  font-size: 11px;
  letter-spacing: 0.28em;
  color: #ccc;
  text-transform: uppercase;
}

.global-nav ul {
  display: flex;
  gap: 24px;
  list-style: none;
}

.global-nav a {
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #fff;
  position: relative;
}

.global-nav a::after {
  content: "";
  position: absolute;
  left: 0; bottom: -4px;
  width: 0; height: 1px;
  background: #6fa8ff;
  transition: width 0.2s ease;
}
.global-nav a:hover::after { width: 100%; }

/* =========================
   ヒーロー
   ========================= */
.hero {
  padding-top: 120px;
  padding-bottom: 100px;
  background: radial-gradient(circle at top left,
    rgba(27,39,53,0.25),
    rgba(5,7,10,0.45),
    rgba(2,3,8,0.55)
  );
}

.hero-inner {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  gap: 60px;
  align-items: center;
}

.hero-copy {
  flex: 1;
  position: relative;
  z-index: 10;
}

.hero-label {
  font-size: 12px;
  letter-spacing: 0.22em;
  color: #6fa8ff;
  margin-bottom: 16px;
}

.hero-title {
  font-size: 38px;
  line-height: 1.5;
  margin-bottom: 20px;
}

.hero-text {
  font-size: 15px;
  line-height: 1.9;
  color: #fff;
  margin-bottom: 32px;
}

.hero-buttons {
  display: flex;
  gap: 14px;
}

.btn-primary,
.btn-secondary {
  padding: 12px 26px;
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
}

.btn-primary {
  background: linear-gradient(135deg, #6fa8ff, #315caa);
  color: #05070a;
  font-weight: 700;
}

.btn-secondary {
  background: transparent;
  border: 1px solid #6fa8ff;
  color: #6fa8ff;
}

.hero-image {
  flex: 1;
  min-height: 320px;
  background: url("hero.jpg") center/cover;
  border-radius: 18px;
  position: relative;
  z-index: 1;
}

.hero-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  border-radius: 18px;
}

/* =========================
   セクション共通
   ========================= */
.section {
  padding: 100px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.section-inner {
  max-width: 1080px;
  margin: 0 auto;
}

.section-label {
  font-size: 12px;
  letter-spacing: 0.22em;
  color: #6fa8ff;
  margin-bottom: 8px;
}

.section-title {
  font-size: 30px;
  letter-spacing: 0.1em;
  margin-bottom: 32px;
}

/* =========================
   フェードイン
   ========================= */
.fade-target {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

.fade-in {
  opacity: 1;
  transform: translateY(0);
}

/* =========================
   ハンバーガー
   ========================= */
.menu-btn {
  display: none;
  width: 32px;
  height: 24px;
  position: relative;
  cursor: pointer;
}

.menu-btn span {
  position: absolute;
  left: 0;
  width: 100%;
  height: 3px;
  background: #fff;
  transition: all 0.3s ease;
}

.menu-btn span:nth-child(1){ top:0; }
.menu-btn span:nth-child(2){ top:10px; }
.menu-btn span:nth-child(3){ top:20px; }

.menu-btn.active span:nth-child(1){
  transform: translateY(10px) rotate(45deg);
}
.menu-btn.active span:nth-child(2){
  opacity:0;
}
.menu-btn.active span:nth-child(3){
  transform: translateY(-10px) rotate(-45deg);
}

@media(max-width:900px){
  .global-nav ul { display:none; }
  .menu-btn { display:block; }

  .global-nav.nav-open ul {
    display:flex;
    flex-direction:column;
    position:absolute;
    top:60px; right:0;
    width:75%;
    background:rgba(5,7,10,0.95);
    border-left:1px solid rgba(255,255,255,0.08);
    padding:20px 0;
  }

  .hero-inner { flex-direction:column; }
}
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-area">
      <span class="logo-main">CHIGASAKI OUTRIGGER</span>
      <span class="logo-sub">CANOE CLUB</span>
    </div>

    <div class="menu-btn" id="menuBtn">
      <span></span><span></span><span></span>
    </div>

    <nav class="global-nav" id="globalNav">
      <ul>
        <li><a href="#about">クラブ紹介</a></li>
        <li><a href="#activity">活動内容</a></li>
        <li><a href="#contact">お問い合わせ</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-copy fade-target">
      <p class="hero-label">OUTRIGGER CANOE CLUB</p>
      <h1 class="hero-title">茅ヶ崎の海から、漕ぎ出せ。</h1>
      <p class="hero-text">
        茅ヶ崎アウトリガーカヌークラブは、海と仲間を愛するパドラーが集うスポーツクラブです。
      </p>
      <div class="hero-buttons">
        <a class="btn-primary" href="#contact">体験・見学</a>
        <a class="btn-secondary" href="#activity">活動内容</a>
      </div>
    </div>

    <div class="hero-image fade-target"></div>
  </div>
</section>

<section id="about" class="section fade-target">
  <div class="section-inner">
    <p class="section-label">ABOUT</p>
    <h2 class="section-title">クラブ紹介</h2>
    <p>茅ヶ崎の海を拠点に活動するアウトリガーカヌークラブです。</p>
  </div>
</section>

<section id="activity" class="section fade-target">
  <div class="section-inner">
    <p class="section-label">ACTIVITY</p>
    <h2 class="section-title">活動内容</h2>
    <p>週末のトレーニング、レース参加、クラブイベントなどを行っています。</p>
  </div>
</section>

<section id="contact" class="section fade-target">
  <div class="section-inner">
    <p class="section-label">CONTACT</p>
    <h2 class="section-title">お問い合わせ</h2>
    <p>体験・見学、入会などはこちらからご連絡ください。</p>
  </div>
</section>

<script>
// ===============================
// スムーススクロール
// ===============================
document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    const target = document.querySelector(a.getAttribute('href'));
    if(!target) return;
    window.scrollTo({ top: target.offsetTop - 60, behavior:"smooth" });
  });
});

// ===============================
// フェードイン（スクロール）
// ===============================
const fadeTargets = document.querySelectorAll('.fade-target');

function fadeInOnScroll(){
  fadeTargets.forEach(el=>{
    const rect = el.getBoundingClientRect();
    if(rect.top < window.innerHeight - 80){
      el.classList.add('fade-in');
    }
  });
}

window.addEventListener('scroll', fadeInOnScroll);
window.addEventListener('load', fadeInOnScroll);

// ===============================
// ハンバーガーメニュー
// ===============================
const menuBtn = document.getElementById('menuBtn');
const globalNav = document.getElementById('globalNav');

menuBtn.addEventListener('click', ()=>{
  menuBtn.classList.toggle('active');
  globalNav.classList.toggle('nav-open');
});
</script>

</body>
</html>
